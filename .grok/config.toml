# Project-scoped Grok MCP config.
# Grok also auto-loads ../.cursor/mcp.json; this makes Lovable explicit for `grok mcp`.
#
# Connect:
#   grok mcp add --transport http --scope project lovable https://mcp.lovable.dev
#   # or use this file, then:
#   grok mcp list
#   grok mcp doctor lovable
#
# First tool use opens a browser OAuth flow. Tokens land in ~/.grok/mcp_credentials.json.
#
# Note: Lovable's OAuth allowlist currently documents ChatGPT, Claude, Claude Code,
# Cursor, and VS Code. If Grok OAuth fails with an unsupported-client error, use
# Cursor (with Grok as the model) instead — Cursor MCP tools are available to Grok.

[mcp_servers.lovable]
url = "https://mcp.lovable.dev"
